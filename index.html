<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Word Map</title><style>body{background:#101722;color:#edf2fa;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}button{background:#24344d;color:white;border:1px solid #536783;border-radius:12px;padding:12px;cursor:pointer;margin:4px}.active{background:#3666a0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid #3c4e68;border-radius:18px;padding:18px}small,p{color:#afbed4}.word small{display:block}@media(max-width:650px){.layout{grid-template-columns:1fr}}</style><main><h1>German Word Map</h1><p>Explore German computer vocabulary.</p><nav id="categories"></nav><div class="layout"><section class="panel"><h3>Select a word</h3><div id="words"></div></section><section class="panel" id="details"></section></div></main><script>
const words=[['Computer Actions','Save','speichern','Base verb'],['Computer Actions','Save As','speichern unter','speichern + unter'],['Computer Actions','Copy','kopieren','Base verb'],['Computer Actions','Paste','einfügen','ein + fügen'],['Computer Actions','Delete','löschen','Base verb'],['Computer Actions','Print','drucken','Base verb'],['Computer Actions','Download','herunterladen','herunter (down) + laden (load)'],['Computer Actions','Upload','hochladen','hoch (up) + laden (load)'],['Computer Actions','Load','laden','Base verb'],['Windows','File','Datei','Base noun'],['Windows','Folder','Ordner','Base noun'],['Windows','Screen','Bildschirm','Bild (image) + Schirm (screen)'],['Windows','Settings','Einstellungen','Einstellung + plural -en'],['Office','Document','Dokument','Base noun'],['Office','Presentation','Präsentation','Base noun'],['Programming','Database','Datenbank','Daten (data) + Bank (bank)'],['Programming','Error','Fehler','Base noun']];const cats=[...new Set(words.map(w=>w[0]))];let cat=cats[0],selected=words[0];function draw(){const c=document.querySelector('#categories'),w=document.querySelector('#words'),d=document.querySelector('#details');c.replaceChildren();w.replaceChildren();d.replaceChildren();for(const x of cats){const b=document.createElement('button');b.textContent=x;b.className=x===cat?'active':'';b.onclick=()=>{cat=x;selected=words.find(y=>y[0]===x);draw()};c.append(b)}for(const x of words.filter(y=>y[0]===cat)){const b=document.createElement('button');b.className='word '+(x===selected?'active':'');b.textContent=x[1];const s=document.createElement('small');s.textContent=x[2];b.append(s);b.onclick=()=>{selected=x;draw()};w.append(b)}const h=document.createElement('h2');h.textContent=selected[2];const p=document.createElement('p');p.textContent='English: '+selected[1];const s=document.createElement('p');s.textContent='Word structure: '+selected[3];const b=document.createElement('button');b.textContent='▶ Listen';b.onclick=()=>{if(!window.speechSynthesis){alert('Speech unavailable');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(selected[2]);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)};d.append(h,p,s,b)}draw();</script></html>
